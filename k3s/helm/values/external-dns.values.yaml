provider:
  name: cloudflare

env:
- name: CF_API_TOKEN
  valueFrom:
    secretKeyRef:
      name: cloudflare-api-token
      key: api-token

domainFilters:
- livingroom.cloud
- torch.cloud
- espwifi.io

managedRecordTypes:
- A
- AAAA
- CNAME
- MX
- TXT

# Allow external-dns to delete records in the provider when they disappear from Kubernetes
# (e.g. when a DNSEndpoint is deleted). Safe when paired with registry=txt + txtOwnerId.
policy: sync
registry: txt
txtOwnerId: mini-cloud
txtPrefix: externaldns

extraArgs:
- --default-targets=174.44.103.42
- --force-default-targets
# Public WAN IP for all managed DNS records. Do not duplicate on Gateway/HTTPRoute annotations.

sources:
- crd
- gateway-httproute

crd:
  create: true

logLevel: info
interval: 1m

serviceAccount:
  create: true

rbac:
  create: true

metrics:
  enabled: false
