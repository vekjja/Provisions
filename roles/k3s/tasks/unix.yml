- name: System tuning for Kubernetes log watchers (inotify / nofile)
  ansible.builtin.include_tasks: tuning.yml
  when: k3s_tuning.enabled | default(true)

- name: Download K3S installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: "/tmp/k3s.sh"
    mode: "0777"

- name: Execute the K3S Installer
  ansible.builtin.shell: "/tmp/k3s.sh {{ k3s.args | join(' ') }}"

- name: Remove the K3S Installer
  ansible.builtin.file:
    path: "/tmp/k3s.sh"
    state: absent

- name: Get K3S Kubeconfig
  run_once: true
  ansible.builtin.fetch:
    src: "{{ k3s.kubeconfig.remote }}"
    dest: "{{ k3s.kubeconfig.local }}"
    flat: true
  tags: kubeconfig

- name: Configure local kubeconfig
  ansible.builtin.include_tasks:
    file: kubeconfig.yml
    apply:
      delegate_to: localhost
      become: false
      run_once: true
      tags:
        - kubeconfig
        - k3s
  when: k3s.kubeconfig.context is defined or k3s.kubeconfig.server is defined
  tags:
    - kubeconfig
    - k3s
