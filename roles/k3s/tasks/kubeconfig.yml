- name: Ensure local kubeconfig directory exists
  ansible.builtin.file:
    path: "{{ k3s.kubeconfig.local | dirname }}"
    state: directory
    mode: "0700"

- name: Normalize kubeconfig server URL
  ansible.builtin.set_fact:
    k3s_kubeconfig_server: "https://{{ k3s.kubeconfig.server }}{{ '' if ':' in k3s.kubeconfig.server else ':6443' }}"
  when: k3s.kubeconfig.server is defined

- name: Set kubeconfig server URL
  ansible.builtin.replace:
    path: "{{ k3s.kubeconfig.local }}"
    regexp: '^(\s+server:\s+).*$'
    replace: '\1{{ k3s_kubeconfig_server }}'
  when: k3s.kubeconfig.server is defined

- name: Set kubeconfig current context
  ansible.builtin.replace:
    path: "{{ k3s.kubeconfig.local }}"
    regexp: '^current-context:\s+.*$'
    replace: 'current-context: {{ k3s.kubeconfig.context }}'
  when: k3s.kubeconfig.context is defined

- name: Rename kubeconfig context, cluster, and user
  ansible.builtin.replace:
    path: "{{ k3s.kubeconfig.local }}"
    regexp: '^  name: default$'
    replace: '  name: {{ k3s.kubeconfig.context }}'
  when: k3s.kubeconfig.context is defined

- name: Rename kubeconfig user entry
  ansible.builtin.replace:
    path: "{{ k3s.kubeconfig.local }}"
    regexp: '^- name: default$'
    replace: '- name: {{ k3s.kubeconfig.context }}'
  when: k3s.kubeconfig.context is defined

- name: Update kubeconfig context cluster reference
  ansible.builtin.replace:
    path: "{{ k3s.kubeconfig.local }}"
    regexp: '^    cluster: default$'
    replace: '    cluster: {{ k3s.kubeconfig.context }}'
  when: k3s.kubeconfig.context is defined

- name: Update kubeconfig context user reference
  ansible.builtin.replace:
    path: "{{ k3s.kubeconfig.local }}"
    regexp: '^    user: default$'
    replace: '    user: {{ k3s.kubeconfig.context }}'
  when: k3s.kubeconfig.context is defined
