- name: Ensure local kubeconfig directory exists
  ansible.builtin.file:
    path: "{{ k3s.kubeconfig.local | dirname }}"
    state: directory
    mode: "0700"

- name: Normalize kubeconfig server URL
  ansible.builtin.set_fact:
    k3s_kubeconfig_server: "https://{{ k3s.kubeconfig.server }}{{ '' if ':' in k3s.kubeconfig.server else ':6443' }}"
  when: k3s.kubeconfig.server is defined

- name: Set kubeconfig server URL
  ansible.builtin.replace:
    path: "{{ k3s.kubeconfig.local }}"
    regexp: '^(\s+server:\s+).*$'
    replace: '\1{{ k3s_kubeconfig_server }}'
  when: k3s.kubeconfig.server is defined

- name: Set kubeconfig current context
  ansible.builtin.replace:
    path: "{{ k3s.kubeconfig.local }}"
    regexp: '^current-context:\s+.*$'
    replace: 'current-context: {{ k3s.kubeconfig.context }}'
  when: k3s.kubeconfig.context is defined

- name: Rename kubeconfig context, cluster, and user
  ansible.builtin.replace:
    path: "{{ k3s.kubeconfig.local }}"
    regexp: '^  name: default$'
    replace: '  name: {{ k3s.kubeconfig.context }}'
  when: k3s.kubeconfig.context is defined

- name: Rename kubeconfig user entry
  ansible.builtin.replace:
    path: "{{ k3s.kubeconfig.local }}"
    regexp: '^- name: default$'
    replace: '- name: {{ k3s.kubeconfig.context }}'
  when: k3s.kubeconfig.context is defined

- name: Update kubeconfig context cluster reference
  ansible.builtin.replace:
    path: "{{ k3s.kubeconfig.local }}"
    regexp: '^    cluster: default$'
    replace: '    cluster: {{ k3s.kubeconfig.context }}'
  when: k3s.kubeconfig.context is defined

- name: Update kubeconfig context user reference
  ansible.builtin.replace:
    path: "{{ k3s.kubeconfig.local }}"
    regexp: '^    user: default$'
    replace: '    user: {{ k3s.kubeconfig.context }}'
  when: k3s.kubeconfig.context is defined

- name: Merge cluster kubeconfig into main kubeconfig
  when: k3s.kubeconfig.merge | default(false) | bool
  block:
    - name: Set main kubeconfig path
      ansible.builtin.set_fact:
        k3s_kubeconfig_main: "{{ lookup('env', 'HOME') }}/.kube/config"

    - name: Ensure main kubeconfig directory exists
      ansible.builtin.file:
        path: "{{ k3s_kubeconfig_main | dirname }}"
        state: directory
        mode: "0700"

    - name: Ensure main kubeconfig file exists
      ansible.builtin.file:
        path: "{{ k3s_kubeconfig_main }}"
        state: touch
        mode: "0600"

    - name: Remove existing cluster entries from main kubeconfig
      ansible.builtin.command:
        cmd: kubectl config {{ item }} {{ k3s.kubeconfig.context }}
      environment:
        KUBECONFIG: "{{ k3s_kubeconfig_main }}"
      loop:
        - delete-context
        - delete-cluster
        - delete-user
      register: k3s_kubeconfig_delete
      changed_when: k3s_kubeconfig_delete.rc == 0
      failed_when: false
      when: k3s.kubeconfig.context is defined

    - name: Merge kubeconfig into main config
      ansible.builtin.shell: |
        set -euo pipefail
        tmp="$(mktemp)"
        KUBECONFIG="{{ k3s_kubeconfig_main }}:{{ k3s.kubeconfig.local }}" kubectl config view --flatten > "$tmp"
        mv "$tmp" "{{ k3s_kubeconfig_main }}"
        chmod 600 "{{ k3s_kubeconfig_main }}"
      args:
        executable: /bin/bash

    - name: Set current context in main kubeconfig
      ansible.builtin.command:
        cmd: kubectl config use-context {{ k3s.kubeconfig.context }}
      environment:
        KUBECONFIG: "{{ k3s_kubeconfig_main }}"
      when: k3s.kubeconfig.context is defined

    - name: Remove downloaded kubeconfig after merge
      ansible.builtin.file:
        path: "{{ k3s.kubeconfig.local }}"
        state: absent
