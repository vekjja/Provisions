- name: Install Common Packages
  ansible.builtin.package:
    name: "{{ unix_packages }}"
    update_cache: true
    state: present
  become: true
  when:
    - unix_packages is defined
    - ansible_facts['os_family'] != 'Darwin'

- name: Install Common Packages (macOS)
  ansible.builtin.homebrew:
    name: "{{ unix_packages }}"
    update_homebrew: true
    state: present
  when:
    - unix_packages is defined
    - ansible_facts['os_family'] == 'Darwin'

- name: Install Selected Packages (Mac/Linux)
  ansible.builtin.package:
    name: "{{ packages | default([]) }}"
    update_cache: true
    state: present
  become: true
  when:
    - packages is defined
    - ansible_facts['os_family'] != 'Darwin'

- name: Install Selected Packages (macOS)
  ansible.builtin.homebrew:
    name: "{{ packages | default([]) }}"
    update_homebrew: true
    state: present
  when:
    - packages is defined
    - ansible_facts['os_family'] == 'Darwin'

- name: Include Fedora/RedHat Tasks
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'

- name: Include Darwin Tasks
  ansible.builtin.include_tasks: darwin.yml
  when: ansible_facts['os_family'] == 'Darwin'
