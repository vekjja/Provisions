- name: Install ethtool
  ansible.builtin.package:
    name: ethtool
    state: present
  become: "{{ use_sudo }}"

- name: Enable Wake-on-LAN on default interface
  ansible.builtin.command: ethtool -s "{{ ansible_facts['default_ipv4']['interface'] }}" wol g
  become: "{{ use_sudo }}"
  when: ansible_facts['default_ipv4']['interface'] is defined
  changed_when: true

- name: Persist Wake-on-LAN across interface up events
  ansible.builtin.copy:
    dest: /etc/NetworkManager/dispatcher.d/99-wakeonlan
    mode: "0755"
    content: |
      #!/bin/bash
      if [ "$2" = "up" ]; then
        ethtool -s "$1" wol g
      fi
  become: "{{ use_sudo }}"
