- name: Install ethtool
  ansible.builtin.package:
    name: ethtool
    state: present
  become: true

- name: Read Wake-on-LAN status
  ansible.builtin.command: ethtool "{{ ansible_facts['default_ipv4']['interface'] }}"
  register: wol_status
  changed_when: false
  become: true
  when: ansible_facts['default_ipv4']['interface'] is defined

- name: Enable Wake-on-LAN on default interface
  ansible.builtin.command: ethtool -s "{{ ansible_facts['default_ipv4']['interface'] }}" wol g
  become: true
  when:
    - ansible_facts['default_ipv4']['interface'] is defined
    - "wol_status.stdout | default('') is not search('Wake-on: g')"

- name: Persist Wake-on-LAN across interface up events
  ansible.builtin.copy:
    dest: /etc/NetworkManager/dispatcher.d/99-wakeonlan
    mode: "0755"
    content: |
      #!/bin/bash
      if [ "$2" = "up" ]; then
        ethtool -s "$1" wol g
      fi
  become: true
