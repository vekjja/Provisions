hostname: dev-node-0

packages:
  - kubectx

files:
  user:
    - { src: 'dotfiles/.vimrc', dest: '~/.vimrc' }
    - { src: 'dotfiles/.zshrc-linux', dest: '~/.zshrc' }
    - { src: 'dotfiles/.zshrc-common', dest: '~/.zshrc-common' }
    - { src: 'themes/oh-my-posh/kev.omp.json', dest: '~/.kev.omp.json' }


firewall_rules:
  - { port: '22', proto: 'tcp', comment: 'SSH' }
  - { port: '80', proto: 'tcp', comment: 'HTTP' }
  - { port: '443', proto: 'tcp', comment: 'HTTPS' }
  - { port: '6443', proto: 'tcp', comment: 'Kubernetes API' }
  - { port: '51820', proto: 'udp', comment: 'WireGuard VPN' }

k3s: # Lightweight Kubernetes: https://github.com/k3s-io/k3s/releases/
  kubeconfig:
    merge: true
    context: dev-node-0
    server: 34.237.174.110
    remote: ~/.kube/k3sconfig
    local: "{{ lookup('env', 'HOME') }}/.kube/dev-node-0"
  args:
    - --disable=traefik
    - --disable=servicelb
    - --tls-san dev-node-0.livingroom.cloud
    - --tls-san 34.237.174.110
    - --node-external-ip=34.237.174.110
    - --prefer-bundled-bin
    - --write-kubeconfig-mode 644
    - --write-kubeconfig ~/.kube/k3sconfig

# Allow kgateway hostNetwork proxies to bind ports 80/443 as non-root.
k3s_tuning_extra_sysctls:
  net.ipv4.ip_unprivileged_port_start: "0"
  net.ipv6.ip_unprivileged_port_start: "0"

