hostname: GameBox

packages:
  - gparted
  - piper
  - steam
  - ntfs-3g 
  - fuse

files:
  user:
    - { src: 'dotfiles/.vimrc', dest: '~/.vimrc' }
    - { src: 'dotfiles/.zshrc-linux', dest: '~/.zshrc' }
    - { src: 'dotfiles/.zshrc-common', dest: '~/.zshrc-common' }
    - { src: 'themes/oh-my-posh/kev.omp.json', dest: '~/.kev.omp.json' }

fs_mounts:
  - {
    path: /mnt/ssd/X,
    src: "UUID=bf8215d6-4043-4430-946f-d62580ebf516",
    fstype: ext4,
    opts: "defaults,nofail,errors=remount-ro",
  }
  - {
    path: /mnt/ssd/Y,
    src: "UUID=146801F76801D7FE",
    fstype: ntfs-3g,
    opts: "defaults,nofail,x-systemd.device-timeout=5,uid=1000,gid=1000,rw,exec,windows_names,lowntfs-3g",
  }
  - {
    path: /mnt/ssd/Z,
    src: "UUID=4AEC51FDEC51E3AB",
    fstype: ntfs3,
    opts: "defaults,nofail,x-systemd.device-timeout=5,uid=1000,gid=1000,rw,exec,windows_names",
  }

